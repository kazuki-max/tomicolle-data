name: learn-from-users
# ユーザー端末から投函された学習データを検証し、references.json とみんなの登録を更新する
# （毎日 04:00 JST ＋ 手動）。写真は一切扱わない（特徴ベクトルと読み取り文字のみ）。
# 投函口は Google Apps Script の Web アプリ（リポジトリ変数 INBOX_URL）。秘密情報は不要。
on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-repo
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Validate submissions and build references
        env:
          INBOX_URL: ${{ vars.INBOX_URL }}
        run: |
          mkdir -p inbox
          python scripts/learn.py inbox
      - name: Merge community items into catalog
        run: python scripts/sync_catalog.py --merge-only
      - name: Commit data repo
        run: |
          git config user.name "tomicolle-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A references.json learning catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "learn: $(date -u +%Y-%m-%d)"
            git push
          fi
